{% set name = "stdlibs" %}
{% set version = "2025.10.28" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/stdlibs-{{ version }}.tar.gz
  sha256: 18db81f45f7783ddf86b80771e061782c70e2f4a8642843b3c80b42cd774b24f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - flit-core >=3,<4
  run:
    - python >={{ python_min }}

test:
  imports:
    - stdlibs
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://stdlibs.omnilib.dev
  summary: List of packages in the stdlib
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - dstoeckel
    - nicornk

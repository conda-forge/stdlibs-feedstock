{% set name = "stdlibs" %}
{% set version = "2026.2.26" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/stdlibs-{{ version }}.tar.gz
  sha256: 10f911bdd8d3e45b452cc187b3527e6f9d288c8a943c5f973da94c71b2757d5b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - flit-core >=3,<4
  run:
    - python >={{ python_min }}

test:
  imports:
    - stdlibs
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://stdlibs.omnilib.dev
  summary: List of packages in the stdlib
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - dstoeckel
    - nicornk
